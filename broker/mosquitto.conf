# configure MQTT broker for the factory simulation

# listens for MQTT connections on port 1883
listener 1883 0.0.0.0

# requires all MQTT clients to authenticate
allow_anonymous false

# specifies the file containing MQTT usernames and password hashes
password_file /mosquitto/auth/passwords

# applies access control rules to MQTT topics
acl_file /mosquitto/config/aclfile

# disables persistent message storage for the simulation
persistence false

# sends broker logs to the Docker container output
log_dest stdout

# records errors, warnings and important broker events
log_type error
log_type warning
log_type notice